# Billing PS — Apache 2.4 (dibuat installer). Placeholder {{...}} diisi saat pemasangan.
Define SRVROOT "{{RUNTIME}}/apache"
ServerRoot "${SRVROOT}"
Listen {{PORT_WEB}}
ServerName localhost:{{PORT_WEB}}

LoadModule actions_module modules/mod_actions.so
LoadModule alias_module modules/mod_alias.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule expires_module modules/mod_expires.so
LoadModule filter_module modules/mod_filter.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so

LoadModule php_module "{{RUNTIME}}/php/php8apache2_4.dll"
PHPIniDir "{{RUNTIME}}/php"
<FilesMatch \.php$>
    SetHandler application/x-httpd-php
</FilesMatch>

# Windows: kirim file besar (APK, backup) tanpa sendfile/mmap supaya tidak terpotong
EnableSendfile Off
EnableMMAP Off
AcceptFilter http none
AcceptFilter https none
ThreadsPerChild 150
Timeout 300
KeepAlive On
LimitRequestBody 0

TypesConfig conf/mime.types
AddType application/vnd.android.package-archive .apk

ErrorLog "{{LOGS}}/apache-error.log"
LogLevel warn

DocumentRoot "{{APP}}/public"
DirectoryIndex index.php index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "{{APP}}/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Folder unggahan (tautan public/storage ke folder data)
<Directory "{{DATA}}/storage/app/public">
    Options FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

<Files ".ht*">
    Require all denied
</Files>

<IfModule deflate_module>
    AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
</IfModule>

<IfModule expires_module>
    <LocationMatch "^/build/">
        ExpiresActive On
        ExpiresDefault "access plus 1 year"
    </LocationMatch>
</IfModule>
