; Delta Billing HuB — MariaDB 10.11 (dibuat installer, ditulis ulang setiap update). Placeholder {{...}} diisi saat pemasangan.
[mysqld]
datadir="{{DATA}}/mysql"
port={{PORT_DB}}
bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-storage-engine=InnoDB
; Kolom TIMESTAMP tanpa ON UPDATE otomatis (lihat perbaikan kolom waktu 2026-10-04)
explicit_defaults_for_timestamp=ON
; Trigger sinkronisasi lokal <-> cloud
log_bin_trust_function_creators=1

; ---- Kinerja (disetel otomatis: buffer pool ±20% RAM PC, 256 MB – 2 GB) ----
innodb_buffer_pool_size={{BUFFER_POOL}}
innodb_log_file_size=256M
innodb_log_buffer_size=16M
; 1 = setiap transaksi pembayaran langsung aman di disk walau listrik padam
innodb_flush_log_at_trx_commit=1
innodb_file_per_table=1
innodb_io_capacity=1000
innodb_stats_on_metadata=0
table_open_cache=2000
table_definition_cache=1400
tmp_table_size=64M
max_heap_table_size=64M
join_buffer_size=1M
sort_buffer_size=2M
thread_cache_size=32
; Tidak dipakai aplikasi: hemat RAM
performance_schema=OFF
max_allowed_packet=64M
max_connections=200
log_error="{{LOGS}}/mariadb-error.log"
; Query lambat (> 2 detik) dicatat untuk pemeriksaan
slow_query_log=1
slow_query_log_file="{{LOGS}}/mariadb-lambat.log"
long_query_time=2
skip-name-resolve

[client]
port={{PORT_DB}}
default-character-set=utf8mb4
