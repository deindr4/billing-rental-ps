; Billing PS — MariaDB 10.11 (dibuat installer). Placeholder {{...}} diisi saat pemasangan.
[mysqld]
datadir="{{DATA}}/mysql"
port={{PORT_DB}}
bind-address=127.0.0.1
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-storage-engine=InnoDB
; Kolom TIMESTAMP tanpa ON UPDATE otomatis (lihat perbaikan kolom waktu 2026-10-04)
explicit_defaults_for_timestamp=ON
; Trigger sinkronisasi lokal <-> cloud
log_bin_trust_function_creators=1
innodb_buffer_pool_size=256M
innodb_log_file_size=64M
innodb_flush_log_at_trx_commit=1
max_allowed_packet=64M
max_connections=200
log_error="{{LOGS}}/mariadb-error.log"
skip-name-resolve

[client]
port={{PORT_DB}}
default-character-set=utf8mb4
