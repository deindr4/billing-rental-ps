; Billing PS — php.ini (dibuat installer). Placeholder {{...}} diisi saat pemasangan.
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
zend.enable_gc = On
expose_php = Off
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{LOGS}}/php-error.log"
variables_order = "GPCS"
request_order = "GP"
post_max_size = 256M
upload_max_filesize = 256M
max_file_uploads = 20
default_charset = "UTF-8"
file_uploads = On
allow_url_fopen = On
default_socket_timeout = 60
realpath_cache_size = 4096K
realpath_cache_ttl = 600
upload_tmp_dir = "{{DATA}}/tmp"
sys_temp_dir = "{{DATA}}/tmp"
extension_dir = "{{RUNTIME}}/php/ext"

extension=curl
extension=exif
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=sockets
extension=sodium
extension=zip
zend_extension=opcache

[Date]
date.timezone = {{ZONA}}

[Session]
session.save_path = "{{DATA}}/tmp"

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
; File program hanya berubah saat update (Apache di-restart). Tetap diperiksa (view Blade bisa dikompilasi ulang
; lewat Pemeliharaan → Optimalkan), tapi cukup tiap 30 detik: lebih sedikit akses disk per permintaan
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
opcache.save_comments = 1

[curl]
curl.cainfo = "{{RUNTIME}}/php/extras/ssl/cacert.pem"

[openssl]
openssl.cafile = "{{RUNTIME}}/php/extras/ssl/cacert.pem"
